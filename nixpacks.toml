[variables]
NIXPACKS_PHP_ROOT_DIR = '/app/public'
NIXPACKS_PHP_FALLBACK_PATH = '/index.php'

[phases.setup]
nixPkgs = ['php82', 'phpPackages.composer', 'php82Extensions.pdo_mysql', 'php82Extensions.gd', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.curl', 'php82Extensions.zip', 'libpng', 'libjpeg', 'libwebp', 'nodejs_18', 'npm-9_x']

[phases.install]
cmds = ['composer install --ignore-platform-reqs', 'npm ci']

[phases.build]
cmds = ['composer install --no-dev --optimize-autoloader', 'npm run build', 'php artisan config:cache', 'php artisan route:cache', 'php artisan view:cache']

[start]
cmd = 'php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
