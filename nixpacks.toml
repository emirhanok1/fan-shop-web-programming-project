[variables]
NIXPACKS_PHP_ROOT_DIR = '/app/public'
NIXPACKS_PHP_FALLBACK_PATH = '/index.php'

[phases.setup]
nixPkgs = [
  "...",
  "php82Extensions.pdo_mysql",
  "php82Extensions.redis",
  "php82Extensions.gd",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "libpng",
  "libjpeg",
  "libwebp"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
